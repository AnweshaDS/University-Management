name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: "Unit 1 - Teacher create hashes password"
            test: TeacherServiceCreateHashesPasswordTest
          - name: "Unit 2 - Teacher duplicate username rejected"
            test: TeacherServiceDuplicateUsernameRejectedTest
          - name: "Unit 3 - Missing teacher gives not found"
            test: TeacherServiceMissingTeacherNotFoundTest
          - name: "Unit 4 - Teacher update keeps old password"
            test: TeacherServiceUpdateKeepsOldPasswordTest
          - name: "Unit 5 - Student missing username rejected"
            test: StudentServiceMissingUsernameRejectedTest
          - name: "Unit 6 - Ownership only owner can edit"
            test: OwnershipOnlyOwnerCanEditTest
          - name: "Integration 1 - Admin creates teacher, password hashed"
            test: AdminCreatesTeacherHashedPasswordIntegrationTest
          - name: "Integration 2 - Teacher edits own record only"
            test: TeacherEditsOwnRecordOnlyIntegrationTest
          - name: "Integration 3 - 401 without login, 403 for student"
            test: UnauthenticatedAndStudentForbiddenIntegrationTest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run ${{ matrix.test }}
        run: ./mvnw -B test -DtrimStackTrace=false -Dtest=${{ matrix.test }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.test }}
          path: target/surefire-reports

  package:
    name: Package application
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Package jar
        run: ./mvnw -B package -DskipTests

  docker-build:
    name: Build Docker image
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t university-app .