name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile main and test code
        run: ./mvnw -B test-compile

      # ---------- Unit tests (one step each) ----------

      - name: "Unit 1 - Teacher create hashes password"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=TeacherServiceCreateHashesPasswordTest

      - name: "Unit 2 - Teacher duplicate username rejected"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=TeacherServiceDuplicateUsernameRejectedTest

      - name: "Unit 3 - Missing teacher gives not found"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=TeacherServiceMissingTeacherNotFoundTest

      - name: "Unit 4 - Teacher update keeps old password"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=TeacherServiceUpdateKeepsOldPasswordTest

      - name: "Unit 5 - Student missing username rejected"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=StudentServiceMissingUsernameRejectedTest

      - name: "Unit 6 - Ownership only owner can edit"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=OwnershipOnlyOwnerCanEditTest

      # ---------- Integration tests (one step each) ----------

      - name: "Integration 1 - Admin creates teacher, password hashed"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=AdminCreatesTeacherHashedPasswordIntegrationTest

      - name: "Integration 2 - Teacher edits own record only"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=TeacherEditsOwnRecordOnlyIntegrationTest

      - name: "Integration 3 - 401 without login, 403 for student"
        if: ${{ !cancelled() }}
        run: ./mvnw -B test -Dtest=UnauthenticatedAndStudentForbiddenIntegrationTest

      # ---------- Package ----------

      - name: Package application
        run: ./mvnw -B package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker-build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t university-app .